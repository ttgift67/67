<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Case Opener</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #7b5cbe;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
        }
        .menu-icon, .wallet-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 0 15px 20px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .case-card {
            background: #ffffff;
            color: #333333;
            border-radius: 16px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .case-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .case-name {
            font-weight: bold;
            font-size: 15px;
        }
        .case-price {
            background: #e8e1f5;
            color: #5c3d99;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .case-price:active {
            transform: scale(0.95);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #ffffff;
            color: #333333;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .modal-content h3 {
            margin-top: 0;
            color: #5c3d99;
        }
        .roulette-window {
            position: relative;
            width: 100%;
            height: 100px;
            background: #f0ebfa;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
            border: 2px solid #d1c4e9;
        }
        .roulette-pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ff4757;
            z-index: 10;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            align-items: center;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        .roulette-item {
            min-width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 28px;
        }
        .roulette-item img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
        }
        .roulette-item span {
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
            color: #555;
            width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .action-btn {
            background: #7b5cbe;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 13px;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="menu-icon">☰ Меню</div>
        <div class="wallet-info">👛 <span id="balance">0</span> ⭐</div>
    </div>

    <div class="container">
        <div class="title">ДОСТУПНЫЕ КЕЙСЫ</div>

        <div class="case-card" id="card-free">
            <div class="case-info">
                <div style="font-size: 32px;">🎁</div>
                <div class="case-name">Galaxy Free</div>
            </div>
            <button class="case-price" onclick="openCase('free')">БЕСПЛАТНО</button>
        </div>

        <div class="case-card" id="card-bomj">
            <div class="case-info">
                <div style="font-size: 32px;">📦</div>
                <div>
                    <div class="case-name">Бомж кейс</div>
                    <div style="font-size: 12px; color: #777;">Цена: 15 ⭐</div>
                </div>
            </div>
            <button class="case-price" onclick="openCase('bomj')">15 ⭐</button>
        </div>

        <div class="case-card" id="card-fire">
            <div class="case-info">
                <div style="font-size: 32px;">🔥</div>
                <div>
                    <div class="case-name">Огненный лудик</div>
                    <div style="font-size: 12px; color: #777;">Цена: 25 ⭐</div>
                </div>
            </div>
            <button class="case-price" onclick="openCase('fire')">25 ⭐</button>
        </div>

        <div class="case-card" id="card-clock">
            <div class="case-info">
                <div style="font-size: 32px;">⏳</div>
                <div>
                    <div class="case-name">А часики тикают</div>
                    <div style="font-size: 12px; color: #777;">Цена: 50 ⭐</div>
                </div>
            </div>
            <button class="case-price" onclick="openCase('clock')">50 ⭐</button>
        </div>

        <div class="case-card" id="card-fifty">
            <div class="case-info">
                <div style="font-size: 32px;">⚖️</div>
                <div>
                    <div class="case-name">Кейс 50 на 50</div>
                    <div style="font-size: 12px; color: #777;">Цена: 50 ⭐</div>
                </div>
            </div>
            <button class="case-price" onclick="openCase('fifty')">50 ⭐</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-title">Открытие кейса</h3>
            <div class="roulette-window">
                <div class="roulette-pointer"></div>
                <div class="roulette-track" id="track"></div>
            </div>
            <div id="drop-text" style="font-weight: bold; margin-bottom: 15px; font-size: 14px;">Крутим рулетку...</div>
            <div id="buttons-container" style="display:none;"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        let username = "";
        try {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                username = tg.initDataUnsafe.user.username || "";
            }
        } catch(e) {} 

        const bypassUsers = ["ttgift67", "wepttik", "new_admin"];

        

        let balance = parseInt(localStorage.getItem('galaxy_balance'));
        if (isNaN(balance)) {
            balance = 0;
        }
        document.getElementById('balance').innerText = balance;

        function saveBalance() {
            localStorage.setItem('galaxy_balance', balance);
            document.getElementById('balance').innerText = balance;
        }

        const caseKeys = ['free', 'bomj', 'fire', 'clock', 'fifty'];
        
        if (!isBypass) {
            caseKeys.forEach(key => {
                let isOpened = localStorage.getItem('opened_' + key);
                if (isOpened === 'true') {
                    let card = document.getElementById('card-' + key);
                    if (card) card.style.display = 'none';
                }
            });
        }

        const casesData = {
            free: {
                name: "Galaxy Free",
                price: 0,
                items: [
                    { name: "+10 ⭐", icon: "⭐", value: 10, weight: 100, isGift: false },
                    { name: "Ничего", icon: "❌", value: 0, weight: 30, isGift: false },
                    { name: "Сердце", icon: "💖", value: 15, weight: 20, isGift: true },
                    { name: "Подарок", icon: "🎁", value: 25, weight: 15, isGift: true },
                    { name: "Букет", icon: "💐", value: 50, weight: 10, isGift: true },
                    { name: "Кубок", icon: "🏆", value: 100, weight: 5, isGift: true },
                    { name: "NFT Брил.", icon: "💎", value: 0, weight: 5, isGift: true }
                ]
            },
            bomj: {
                name: "Бомж кейс",
                price: 15,
                items: [
                    { name: "+15 ⭐", icon: "⭐", value: 15, weight: 60, isGift: false },
                    { name: "Ничего", icon: "❌", value: 0, weight: 15, isGift: false },
                    { name: "Роза", icon: "🌹", value: 25, weight: 12, isGift: true },
                    { name: "Торт", icon: "🎂", value: 50, weight: 8, isGift: true },
                    { name: "Колечко", icon: "💍", value: 100, weight: 5, isGift: true },
                    { name: "NFT Ракета", icon: "🚀", value: 0, weight: 0, isGift: true }
                ]
            },
            fire: {
                name: "Огненный лудик",
                price: 25,
                items: [
                    { name: "Подарок", icon: "🎁", value: 25, weight: 60, isGift: true },
                    { name: "Сердце", icon: "💖", value: 15, weight: 20, isGift: true },
                    { name: "Ничего", icon: "❌", value: 0, weight: 10, isGift: false },
                    { name: "Шампанское", icon: "🍾", value: 50, weight: 7, isGift: true },
                    { name: "Кубок", icon: "🏆", value: 100, weight: 3, isGift: true },
                    { name: "NFT Брил.", icon: "💎", value: 0, weight: 0, isGift: true }
                ]
            },
            clock: {
                name: "А часики тикают",
                price: 50,
                items: [
                    { name: "Сердце", icon: "💖", value: 15, weight: 50, isGift: true },
                    { name: "+10 ⭐", icon: "⭐", value: 10, weight: 25, isGift: false },
                    { name: "Подарок", icon: "🎁", value: 25, weight: 15, isGift: true },
                    { name: "Торт", icon: "🎂", value: 50, weight: 8, isGift: true },
                    { name: "NFT Колечко", icon: "💍", value: 0, weight: 1, isGift: true },
                    { name: "Ничего", icon: "❌", value: 0, weight: 1, isGift: false }
                ]
            },
            fifty: {
                name: "Кейс 50 на 50",
                price: 50,
                items: [
                    { name: "Букет", icon: "💐", value: 50, weight: 10, isGift: true },
                    { name: "Ничего", icon: "❌", value: 0, weight: 90, isGift: false }
                ]
            }
        };

        let currentWin = null;
        let activeKey = null;

        function openCase(caseKey) {
            let caseConfig = casesData[caseKey];

            if (balance < caseConfig.price) {
                alert("Недостаточно звезд!");
                return;
            }

            activeKey = caseKey;
            balance -= caseConfig.price;
            saveBalance();

            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const track = document.getElementById('track');
            const dropText = document.getElementById('drop-text');
            const btnContainer = document.getElementById('buttons-container');

            modal.style.display = 'flex';
            modalTitle.innerText = caseConfig.name;
            btnContainer.style.display = 'none';
            dropText.innerText = 'Крутим рулетку...';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            let itemsArray = [];
            for (let i = 0; i < 40; i++) {
                let randIndex = Math.floor(Math.random() * caseConfig.items.length);
                itemsArray.push(caseConfig.items[randIndex]);
            }

            if (caseConfig.price === 0) {
                currentWin = caseConfig.items[0];
            } else {
                let totalWeight = caseConfig.items.reduce((sum, item) => sum + item.weight, 0);
                let randomNum = Math.random() * totalWeight;
                for (let item of caseConfig.items) {
                    if (randomNum < item.weight) {
                        currentWin = item;
                        break;
                    }
                    randomNum -= item.weight;
                }
                if (!currentWin) currentWin = caseConfig.items[0];
            }

            itemsArray[35] = currentWin;

            let itemsHTML = '';
            for (let i = 0; i < itemsArray.length; i++) {
                itemsHTML += `<div class="roulette-item">${itemsArray[i].icon}<span>${itemsArray[i].name}</span></div>`;
            }
            track.innerHTML = itemsHTML;

            setTimeout(() => {
                let targetOffset = (35 * 90) - 130; 
                track.style.transition = 'transform 4s cubic-bezier(0.08, 0.82, 0.15, 1)';
                track.style.transform = `translateX(-${targetOffset}px)`;
            }, 50);

            setTimeout(() => {
                if (currentWin.isGift) {
                    dropText.innerText = `Ты выиграл подарок: ${currentWin.name}!`;
                    btnContainer.innerHTML = `
                        <div class="btn-group">
                            <button class="action-btn" onclick="handleGiftAction('withdraw')">Вывести</button>
                            <button class="action-btn" onclick="handleGiftAction('exchange')">Обменять</button>
                        </div>
                    `;
                } else {
                    if (currentWin.value > 0) {
                        balance += currentWin.value;
                        saveBalance();
                        dropText.innerText = `Ты выиграл ${currentWin.value} ⭐ на баланс!`;
                    } else {
                        dropText.innerText = `К сожалению, ничего не выиграл ❌`;
                    }
                    btnContainer.innerHTML = `<button class="action-btn" style="width:100%; margin-top:10px;" onclick="closeModal()">Забрать</button>`;
                }

                btnContainer.style.display = 'block';

                if (!isBypass && activeKey) {
                    localStorage.setItem('opened_' + activeKey, 'true');
                    let card = document.getElementById('card-' + activeKey);
                    if (card) card.style.display = 'none';
                }

            }, 4100);
        }

        function handleGiftAction(action) {
            if (action === 'withdraw') {
                alert("Запрос на вывод подарка отправлен!");
            } else {
                if (currentWin.value > 0) {
                    balance += currentWin.value;
                    saveBalance();
                    alert(`Подарок успешно обменен на ${currentWin.value} ⭐!`);
                } else {
                    alert("Этот предмет нельзя обменять.");
                }
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
