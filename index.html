<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Case Opener</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #7b5cbe;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
        }
        .menu-icon, .wallet-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 0 15px 20px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .case-card {
            background: #ffffff;
            color: #333333;
            border-radius: 16px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .case-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .case-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }
        .case-name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .case-price {
            background: #e8e1f5;
            color: #5c3d99;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="menu-icon">☰ Меню</div>
        <div class="wallet-info">👛 <span>10</span> ⭐</div>
    </div>

    <div class="container">
        <div class="title">ДОСТУПНЫЕ КЕЙСЫ</div>

        <div class="case-card">
            <div class="case-info">
                <div style="font-size: 32px;">🎁</div>
                <div>
                    <div class="case-name">Galaxy Free</div>
                    <div style="font-size: 12px; color: #777;">Стартовый кейс</div>
                </div>
            </div>
            <button class="case-price">БЕСПЛАТНО</button>
        </div>

        <div class="case-card">
            <div class="case-info">
                <div style="font-size: 32px;">📦</div>
                <div>
                    <div class="case-name">Бомж кейс</div>
                    <div style="font-size: 12px; color: #777;">Простой лут</div>
                </div>
            </div>
            <button class="case-price">10 ⭐</button>
        </div>

        <div class="case-card">
            <div class="case-info">
                <div style="font-size: 32px;">🔥</div>
                <div>
                    <div class="case-name">Огненный лудик</div>
                    <div style="font-size: 12px; color: #777;">Горячие шансы</div>
                </div>
            </div>
            <button class="case-price">25 ⭐</button>
        </div>

        <div class="case-card">
            <div class="case-info">
                <div style="font-size: 32px;">⏳</div>
                <div>
                    <div class="case-name">А часики тикают</div>
                    <div style="font-size: 12px; color: #777;">Время ценных призов</div>
                </div>
            </div>
            <button class="case-price">30 ⭐</button>
        </div>

        <div class="case-card">
            <div class="case-info">
                <div style="font-size: 32px;">⚖️</div>
                <div>
                    <div class="case-name">Кейс 50 на 50</div>
                    <div style="font-size: 12px; color: #777;">Либо пан, либо пропал</div>
                </div>
            </div>
            <button class="case-price">45 ⭐</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран в Telegram
    </script>
</body>
</html>
